name: Wallpad Fee Monitor
version: "0.2.1"
slug: wallpad_fee_monitor
description: Capture Kocom wallpad management-fee packets through Mango/OpenWrt and publish Home Assistant MQTT sensors.
url: "https://github.com/your-name/wallpad-fee-monitor"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
services:
  - mqtt:need
options:
  mango_host: "192.168.0.16"
  mango_port: 22
  mango_user: "root"
  mango_password: ""
  mango_interface: "br-lan"
  wallpad_ip: "10.109.35.41"
  server_ip: "10.254.254.1"
  server_port: 15000
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  mqtt_topic_prefix: "wallpad/fee"
  active_query_enabled: false
  active_query_interval_hours: 24
  active_query_startup_delay_seconds: 30
  active_query_packets: ""
  log_level: "info"
schema:
  mango_host: str
  mango_port: int
  mango_user: str
  mango_password: password
  mango_interface: str
  wallpad_ip: str
  server_ip: str
  server_port: int
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password
  mqtt_discovery_prefix: str
  mqtt_topic_prefix: str
  active_query_enabled: bool
  active_query_interval_hours: int
  active_query_startup_delay_seconds: int
  active_query_packets: str
  log_level: list(debug|info|warning|error)
